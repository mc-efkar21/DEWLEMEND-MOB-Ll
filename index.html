<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dewlemend Mobil Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-ff {
            background-color: #ef4444;
            color: white;
        }
        .btn-ff:hover {
            background-color: #dc2626;
        }
        .btn-macro {
            background-color: #3b82f6;
            color: white;
        }
        .btn-macro:hover {
            background-color: #2563eb;
        }
        #durum {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dewlemend Kontrol Paneli</h2>
        <div class="btn-group">
            <!-- En Kısa Süreli FF'e Giriş Butonu -->
            <button class="btn-ff" id="enHizliFfBtn">En Kısa Süre Kalınan FF'e Gir</button>
            
            <!-- Diğer Makro / Otomasyon Butonları Buraya Eklenebilir -->
            <button class="btn-macro" onclick="alert('Makro döngüsü aktif!')">Oto Altın / İşlem Başlat</button>
        </div>
        <div id="durum">Sistem Hazır</div>
    </div>

    <script>
        document.getElementById('enHizliFfBtn').addEventListener('click', function() {
            const durumYazisi = document.getElementById('durum');
            durumYazisi.innerText = "En kısa süreli FF taranıyor...";
            
            // Oyun içi FF sayaç yapısına göre elementleri yakalama mantığı
            setTimeout(() => {
                // Örnek simülasyon (Oyun yapına göre buradaki seçici özelleştirilebilir)
                durumYazisi.innerText = "En kısa süreli FF bulundu ve giriş tetiklendi!";
            }, 600);
        });
    </script>

</body>
</html>
