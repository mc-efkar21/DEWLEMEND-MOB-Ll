<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dewlemend - Mobil Oto FFA & Makro</title>
    <style>
        body { margin: 0; background: #18181b; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        #top-bar { 
            display: flex; 
            background: #202024; 
            height: 48px; 
            align-items: center; 
            padding: 0 10px; 
            border-bottom: 1px solid #333; 
            flex-shrink: 0; 
            justify-content: space-between; 
            gap: 6px;
            z-index: 10;
        }

        .brand { color: #d946ef; font-weight: bold; font-size: 11px; }

        .macro-controls {
            display: flex;
            gap: 4px;
        }

        .macro-btn {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .macro-btn.active {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }

        #toggle-auto-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
        }
        #toggle-auto-btn.active { background: #10b981; }

        #game-container { 
            flex: 1; 
            width: 100%;
            height: calc(100vh - 48px);
            background: #000;
            position: relative;
        }

        object, embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <div class="brand">⚡ DEWLEMEND</div>
        
        <div class="macro-controls">
            <button class="macro-btn active" onclick="setSpeed(1, this)">1x</button>
            <button class="macro-btn" onclick="setSpeed(1.5, this)">1.5x</button>
            <button class="macro-btn" onclick="setSpeed(2, this)">2x</button>
        </div>

        <button id="toggle-auto-btn" onclick="toggleAutoSystem()">BAŞLAT</button>
    </div>
    
    <div id="game-container">
        <iframe id="game-frame" src="https://www.rgarz.com" style="width:100%; height:100%; border:none;"></iframe>
    </div>
    
    <script>
        let isAutoRunning = false;
        let currentSpeed = 1;

        function setSpeed(speed, btn) {
            currentSpeed = speed;
            document.querySelectorAll('.macro-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleAutoSystem() {
            isAutoRunning = !isAutoRunning;
            const btn = document.getElementById('toggle-auto-btn');

            if (isAutoRunning) {
                btn.innerText = "DURDUR";
                btn.classList.add('active');
            } else {
                btn.innerText = "BAŞLAT";
                btn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
