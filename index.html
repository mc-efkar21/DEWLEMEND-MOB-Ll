<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dewlemend Mobil Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #38bdf8;
        }
        .section-title {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 12px 0 6px 0;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .speed-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-ff {
            background-color: #ef4444;
            color: white;
        }
        .btn-ff:hover {
            background-color: #dc2626;
        }
        .btn-speed {
            background-color: #334155;
            color: #f8fafc;
            padding: 10px 5px;
            font-size: 0.85rem;
        }
        .btn-speed.active {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .btn-macro {
            background-color: #3b82f6;
            color: white;
        }
        #durum {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        /* Netlify rozetini ve reklamını tamamen gizler */
        #netlify-badge, a[href*="netlify.com/support"], .netlify-badge {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dewlemend Kontrol Paneli</h2>
        
        <div class="btn-group">
            <!-- En Kısa Süreli FF'e Giriş Butonu -->
            <button class="btn-ff" id="enHizliFfBtn">En Kısa Süre Kalınan FF'e Gir</button>
            
            <div class="section-title">Hız Çarpanları</div>
            <!-- Hız Butonları (1x, 1.5x, 2x, 2.5x) -->
            <div class="speed-grid">
                <button class="btn-speed active" onclick="hizAyarla(1, this)">1x</button>
                <button class="btn-speed" onclick="hizAyarla(1.5, this)">1.5x</button>
                <button class="btn-speed" onclick="hizAyarla(2, this)">2x</button>
                <button class="btn-speed" onclick="hizAyarla(2.5, this)">2.5x</button>
            </div>

            <div class="section-title">Diğer İşlemler</div>
            <button class="btn-macro" onclick="alert('Makro döngüsü aktif!')">Oto İşlem Başlat</button>
        </div>
        
        <div id="durum">Sistem Hazır (Hız: 1x)</div>
    </div>

    <script>
        function hizAyarla(kat, element) {
            document.querySelectorAll('.btn-speed').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('durum').innerText = "Hız ayarlandı: " + kat + "x";
        }

        document.getElementById('enHizliFfBtn').addEventListener('click', function() {
            const durumYazisi = document.getElementById('durum');
            durumYazisi.innerText = "En kısa süreli FF taranıyor...";
            
            setTimeout(() => {
                durumYazisi.innerText = "En kısa süreli FF bulundu ve giriş tetiklendi!";
            }, 600);
        });
    </script>

</body>
</html>
