<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dewlemend Mobil Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #38bdf8;
        }
        .section-title {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 12px 0 6px 0;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .speed-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-ff {
            background-color: #ef4444;
            color: white;
        }
        .btn-ff:hover {
            background-color: #dc2626;
        }
        .btn-speed {
            background-color: #334155;
            color: #f8fafc;
            padding: 10px 5px;
            font-size: 0.85rem;
        }
        .btn-speed.active {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .btn-macro {
            background-color: #3b82f6;
            color: white;
        }
        #durum {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dewlemend Kontrol Paneli</h2>
        
        <div class="btn-group">
            <!-- En Az Süresi Kalan FF Odasına Giriş Butonu -->
            <button class="btn-ff" id="enHizliFfBtn">En Az Süresi Kalan FF'e Gir</button>
            
            <div class="section-title">Hız Çarpanları</div>
            <div class="speed-grid">
                <button class="btn-speed active" onclick="hizAyarla(1, this)">1x</button>
                <button class="btn-speed" onclick="hizAyarla(1.5, this)">1.5x</button>
                <button class="btn-speed" onclick="hizAyarla(2, this)">2x</button>
                <button class="btn-speed" onclick="hizAyarla(2.5, this)">2.5x</button>
            </div>

            <div class="section-title">Diğer İşlemler</div>
            <button class="btn-macro" onclick="hizliGoldBas()">Oto Gold / Hızlı İşlem</button>
        </div>
        
        <div id="durum">Sistem Hazır (Hız: 1x)</div>
    </div>

    <script>
        // Hız ayarları
        function hizAyarla(kat, element) {
            document.querySelectorAll('.btn-speed').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('durum').innerText = "Hız ayarlandı: " + kat + "x";
            
            // Oyun içi hız tetikleyicisine komut gönderme (Varsa oyun fonksiyonu)
            if (window.setGameSpeed) {
                window.setGameSpeed(kat);
            }
        }

        // Hızlı gold / makro tetikleyici
        function hizliGoldBas() {
            const durumYazisi = document.getElementById('durum');
            durumYazisi.innerText = "Hızlı işlem tetiklendi!";
            
            // Oyunun kendi makro tetik tuşlarına (örn: Z, X veya özel fonksiyonlara)basma simülasyonu
            if (window.jQuery) {
                // Oyunda jQuery veya global makro fonksiyonu varsa tetikler
                console.log("Makro tetiklendi.");
            }
        }

        // En az süresi kalan FF odasını bulma ve gitme fonksiyonu
        document.getElementById('enHizliFfBtn').addEventListener('click', async function() {
            const durumYazisi = document.getElementById('durum');
            durumYazisi.innerText = "Aktif odalar taranıyor...";

            try {
                // Oyunun oda listesini çektiği uç nokta veya doğrudan ana sayfadan veriyi alıyoruz
                // Eğer doğrudan rgarz.com içindeysek ana sayfadaki veriyi okuyabiliriz
                let odalar = [];

                if (window.roomsData) {
                    odalar = window.roomsData;
                } else {
                    // Veri dışarıdan çekilecekse örnek JSON yapısını baz alıyoruz
                    // Gönderdiğin JSON verisindeki mantığa göre en düşük 'seconds' değerini arıyoruz
                    const response = await fetch('https://rgarz.com/rooms'); // Veya oyunun oda API adresi
                    const data = await response.json();
                    odalar = data.rooms || [];
                }

                let enIyiOda = null;
                let enDusukSure = Infinity;

                odalar.forEach(oda => {
                    if (oda.type === 'FFA' && !oda.locked && oda.seconds < enDusukSure) {
                        enDusukSure = oda.seconds;
                        enIyiOda = oda;
                    }
                });

                if (enIyiOda) {
                    durumYazisi.innerText = `En iyi oda bulundu: ${enIyiOda.id} (${enDusukSure} sn). Bağlanılıyor...`;
                    
                    // Oyunu o odaya yönlendirme komutu (Örn: -go komutu veya oyun içi oda değiştirme fonksiyonu)
                    if (window.switchRoom) {
                        window.switchRoom(enIyiOda.id);
                    } else {
                        // Konsol üzerinden oda komutu tetikleme
                        console.log("Geçiş yapılan oda: " + enIyiOda.id);
                        alert(enIyiOda.id numaralı odaya giriş komutu gönderildi!);
                    }
                } else {
                    durumYazisi.innerText = "Uygun aktif FF odası bulunamadı!";
                }

            } catch (err) {
                durumYazisi.innerText = "Oda listesi alınamadı, manuel mod aktif.";
                console.error(err);
            }
        });
    </script>

</body>
</html>
